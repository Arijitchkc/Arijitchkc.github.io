# The Site Configuration

theme: jekyll-theme-chirpy

lang: en
timezone: Asia/Kolkata

title: Arijit Chakraborty
tagline: "There's some good in this world Mr. Frodo and it's worth fighting for."
description: >-
  An academic portfolio website.

url: "https://arijitchkc.github.io"

github:
  username: Arijitchkc

twitter:
  username: arijitchkc

social:
  name: Arijit Chakraborty
  email: chakrabortyarijit1315@gmail.com
  links:
    - https://github.com/Arijitchkc
    - https://twitter.com/arijitchkc
    - https://bsky.app/profile/arijitchk.bsky.social

webmaster_verifications:
  google: -3XAJ_vMOhyRhYblTO2gdqrq4GBUTshUCLjRoVhONp4

analytics:
  google:
    id:

theme_mode:

cdn:

avatar: /assets/img/images/author-image.jpg

toc: true

comments:
  provider:

pwa:
  enabled: false
  cache:
    enabled: false
    deny_paths:

baseurl: ""

kramdown:
  footnote_backlink: "&#8617;︎"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
      toc: false

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - package*.json
  - readJSON.py

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
